# Conda environment for the barbell tracker project.
# Create with:  conda env create -f environment.yml
# Update with:  conda env update -f environment.yml --prune
name: barbell-tracker
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8.15
  - pip
  - numpy=1.23.5
  - pandas=1.5.2
  - matplotlib=3.6.2
  - scipy
  - scikit-learn
  - seaborn
  - pyyaml
  - joblib
  - tqdm
  - pip:
      - ruff
      - pytest
      - streamlit
