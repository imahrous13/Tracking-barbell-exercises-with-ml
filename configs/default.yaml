seed: 42

paths:
  project_root: .
  raw_dir: data/raw/MetaMotion
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

data:
  accel_hz: 12.5
  gyro_hz: 25.0
  resample_ms: 200
  # 200 ms -> 5 Hz. Keeps both sensors aligned after downsampling.
  labels: [bench, dead, ohp, rest, row, squat]
  participants: [A, B, C, D, E]

preprocessing:
  outlier_method: chauvenet
  chauvenet_c: 2
  # Chauvenet is applied per (participant, label) to avoid marking
  # legitimate exercise-specific extremes as outliers.

features:
  lowpass_cutoff_hz: 1.3
  lowpass_order: 5
  pca_components: 3
  temporal_window: 5
  fft_window: 14
  kmeans_clusters: 5

windowing:
  window_size: 14       # ~2.8 s at 5 Hz
  step_size: 7          # 50% overlap
  min_samples_per_window: 10

modeling:
  cv: leave_one_subject_out
  held_out_subject: A   # final test subject, never used for tuning
  tuning_subjects: [B, C, D, E]
  random_state: 42
  n_jobs: -1

reps:
  signal: acc_r
  filter_cutoff_hz: 0.4
  filter_order: 10
  min_peak_distance: 5   # samples at 5 Hz